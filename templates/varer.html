{% extends 'base.html' %}

{% block content %}
{% for kategori, gruppe in vareliste|groupby('kategori') %}
    {% if kategori != 'Varm mat' %}
    <h2 class="kategori_tittel">{{ kategori }}</h2>
    <div class="varer">
        {% for vare in gruppe %}
            <div class="thing">
                <img src="{{ vare.bilde }}" alt="{{ vare.navn }}">
                <h3>{{ vare.navn }}</h3>
                <p class="beskrivelse">{{ vare.beskrivelse }}</p>
                <p class="pris">{{ vare.pris }} kr</p>
            </div>
        {% endfor %}
    </div>
    {% endif %}
{% endfor %}
{% endblock %}
